<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Sentence Analyzer</h1>
    <p>Enter a sentence ending with a point (.)</p>
    
    <textarea id="sentence" placeholder="Type your sentence here..."></textarea><br>
    <button onclick="analyzeSentence()">Analyze Sentence</button>

    <div class="result" id="result" style="display: none;">
        <h2>Results:</h2>
        <p><strong>Length of sentence:</strong> <span id="length">0</span></p>
        <p><strong>Number of words:</strong> <span id="words">0</span></p>
        <p><strong>Number of vowels:</strong> <span id="vowels">0</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
